<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MA ZIYU — Portfolio</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0;background:#121212;overflow:hidden}.hero{position:relative;width:100%;height:100%;overflow:hidden}.layer{position:absolute;inset:0;background:center/cover no-repeat;opacity:0}.clean{transition:opacity 1.2s ease}.full{filter:blur(12px);transition:opacity 4.5s cubic-bezier(.16,1,.3,1),filter 4.5s cubic-bezier(.16,1,.3,1)}.ready .clean,.ready .full{opacity:1}.ready .full{filter:none}.entry{position:absolute;inset:0}.entry:focus-visible{outline:2px solid white;outline-offset:-8px}@media(prefers-reduced-motion:reduce){.layer{transition:none}}
  </style>
</head>
<body>
  <main class="hero" id="hero">
    <div class="layer clean" id="clean"></div>
    <div class="layer full" id="full"></div>
    <a class="entry" id="entry"></a>
  </main>
  <script src="./content.js"></script>
  <script>
    const c=PORTFOLIO.home,hero=document.querySelector('#hero');
    document.title=c.title;
    clean.style.backgroundImage=`url('${c.cleanImage}')`;
    full.style.backgroundImage=`url('${c.fullImage}')`;
    entry.href=c.projectLink; entry.ariaLabel=c.projectLabel;
    Promise.all([c.cleanImage,c.fullImage].map(src=>new Promise(done=>{const i=new Image;i.onload=i.onerror=done;i.src=src}))).then(()=>hero.classList.add('ready'));
    setTimeout(()=>hero.classList.add('ready'),2500);
  </script>
</body>
</html>
