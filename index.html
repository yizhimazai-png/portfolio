<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MA ZIYU -- Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #121212;
      overflow: hidden;
    }

    /* 封面主容器 */
    .hero-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* 共同图层样式：绝对定位铺满 */
    .bg-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* 图一：纯净毛玻璃背景 */
    .bg-clean {
      background-image: url('./images/bg-clean.jpg');
      z-index: 1;
    }

    /* 图二：带文字信息的毛玻璃背景 */
    .bg-full {
      background-image: url('./images/bg-full.jpg');
      z-index: 2;
      opacity: 0; /* 初始完全透明 */
      
      /* 关键动画：以平滑“渐隐/渐现”方式融合 */
      animation: fadeInTransition 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      animation-delay: 0.4s; /* 页面加载后稍微停留0.4秒开始变变变 */
    }

    /* 渐显动画定义 (Cross-Fade) */
    @keyframes fadeInTransition {
      0% {
        opacity: 0;
        filter: blur(8px); /* 带有极其微弱的镜头模糊散开感 */
      }
      100% {
        opacity: 1;
        filter: blur(0px);
      }
    }
  </style>
</head>
<body>

  <div class="hero-wrapper">
    <!-- 底层：单纯毛玻璃 -->
    <div class="bg-layer bg-clean"></div>
    
    <!-- 顶层：有信息的毛玻璃（通过透明度渐变浮现） -->
    <div class="bg-layer bg-full"></div>
  </div>

</body>
</html>
